<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دیار عبدالعزيز فريق | منصة الخدمات وتحويل المستندات الآمنة</title>

    <!-- مكتبات المعالجة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <!-- ✅ جديدة: لتحويل HTML الناتج من mammoth إلى PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* … احتفظ بنفس الـ CSS الذي لديك … */
    </style>
</head>
<body>

    <div id="toast" class="toast"><span id="toastMsg">رسالة</span></div>

    <header class="glass-panel">
        <div class="container header-content">
            <div class="brand-logo">
                <div class="logo-icon">D</div>
                <div class="brand-text">
                    <h1>دیار عبدالعزيز فريق</h1>
                    <span><i class="pulse-dot"></i> حماية قصوى 100%</span>
                </div>
            </div>
            <select id="langSelector" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar" selected>العربية</option>
                <option value="en">English</option>
                <option value="badini">Kurdî (Badinî)</option>
                <option value="sorani">كوردی (Soranî)</option>
            </select>
        </div>
    </header>

    <main class="container" style="padding-top:30px;padding-bottom:50px;">
        <section class="hero">
            <h2>تحويل المستندات والخدمات البرمجية <br><span class="gradient-text">بأعلى معايير الأمان</span></h2>
        </section>

        <section id="converter" style="margin-top:40px;">
            <div class="converter-grid">
                <div class="conversion-options">
                    <button class="opt-btn active" id="opt-word-pdf" onclick="selectConversion('word-pdf')">
                        <div><span class="opt-btn-title">Word ➔ PDF</span>
                        <span class="opt-btn-desc">.docx فقط</span></div>
                    </button>
                    <button class="opt-btn" id="opt-pdf-word" onclick="selectConversion('pdf-word')">
                        <div><span class="opt-btn-title">PDF ➔ Word</span>
                        <span class="opt-btn-desc">.pdf</span></div>
                    </button>
                    <button class="opt-btn" id="opt-pdf-ppt" onclick="selectConversion('pdf-ppt')">
                        <div><span class="opt-btn-title">PDF ➔ PowerPoint</span>
                        <span class="opt-btn-desc">.pdf</span></div>
                    </button>
                    <button class="opt-btn" id="opt-ppt-pdf" onclick="selectConversion('ppt-pdf')">
                        <div><span class="opt-btn-title">PowerPoint ➔ PDF</span>
                        <span class="opt-btn-desc">يتطلب سيرفر</span></div>
                    </button>
                </div>

                <div class="glass-panel dropzone-container">
                    <div>
                        <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
                            <strong id="selectedOptionTitle">Word ➔ PDF</strong>
                            <span id="allowedExtText" style="font-size:.75rem;">.docx</span>
                        </div>

                        <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                            <input type="file" id="fileInput" style="display:none" onchange="handleFile(this.files[0])" accept=".docx">
                            <div class="upload-icon">📁</div>
                            <h4>اسحب الملف هنا أو انقر للاختيار</h4>
                            <button type="button" class="btn-secondary">تصفح</button>
                        </div>

                        <div id="fileInfoArea" style="display:none;margin-top:15px;background:rgba(15,23,42,.6);padding:12px;border-radius:8px;">
                            <div style="display:flex;justify-content:space-between;font-size:.85rem;">
                                <span id="fileNameDisplay"></span>
                                <span id="fileSizeDisplay" style="color:#94a3b8"></span>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top:20px;display:flex;justify-content:flex-end;">
                        <button class="btn-primary" id="btnConvert" disabled onclick="executeConversion()">بدء التحويل والتنزيل</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="glass-panel" style="padding:20px;text-align:center;color:#94a3b8;">
        <p>© 2026 دیار عبدالعزيز فريق</p>
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        /* ------------------ الإعدادات ------------------ */
        const MODES = {
            'word-pdf': { exts: ['.docx'],             title: 'Word ➔ PDF',            accept: '.docx' },
            'pdf-word': { exts: ['.pdf'],              title: 'PDF ➔ Word',            accept: '.pdf'  },
            'pdf-ppt':  { exts: ['.pdf'],              title: 'PDF ➔ PowerPoint',      accept: '.pdf'  },
            'ppt-pdf':  { exts: ['.pptx'],             title: 'PowerPoint ➔ PDF',      accept: '.pptx' }
        };

        let currentMode = 'word-pdf';
        let selectedFile = null;

        /* ------------------ أدوات مساعدة ------------------ */
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('show');
            clearTimeout(t._t);
            t._t = setTimeout(() => t.classList.remove('show'), 3500);
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 2000);
        }

        /* ------------------ اختيار الوضع ------------------ */
        function selectConversion(mode) {
            currentMode = mode;
            const cfg = MODES[mode];
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('opt-' + mode).classList.add('active');
            document.getElementById('selectedOptionTitle').textContent = cfg.title;
            document.getElementById('allowedExtText').textContent = 'الصيغ: ' + cfg.exts.join(', ');
            const inp = document.getElementById('fileInput');
            inp.value = '';
            inp.accept = cfg.accept;
            selectedFile = null;
            document.getElementById('fileInfoArea').style.display = 'none';
            document.getElementById('btnConvert').disabled = true;
        }

        /* ------------------ استلام الملف ------------------ */
        function handleFile(file) {
            if (!file) return;
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            if (!MODES[currentMode].exts.includes(ext)) {
                showToast('صيغة غير مدعومة. المسموح: ' + MODES[currentMode].exts.join(', '));
                return;
            }
            selectedFile = file;
            document.getElementById('fileNameDisplay').textContent = file.name;
            document.getElementById('fileSizeDisplay').textContent = (file.size / 1024).toFixed(1) + ' KB';
            document.getElementById('fileInfoArea').style.display = 'block';
            document.getElementById('btnConvert').disabled = false;
        }

        /* Drag & Drop */
        const dz = document.getElementById('dropzone');
        ['dragenter','dragover'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.add('dragover'); }));
        ['dragleave','drop'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.remove('dragover'); }));
        dz.addEventListener('drop', ev => handleFile(ev.dataTransfer.files[0]));

        /* ------------------ المُنفّذ ------------------ */
        async function executeConversion() {
            if (!selectedFile) return;
            const btn = document.getElementById('btnConvert');
            btn.disabled = true;
            const original = btn.textContent;
            btn.textContent = 'جاري التحويل…';

            try {
                switch (currentMode) {
                    case 'word-pdf': await convertWordToPdf(selectedFile); break;
                    case 'pdf-word': await convertPdfToWord(selectedFile); break;
                    case 'pdf-ppt':  await convertPdfToPpt(selectedFile);  break;
                    case 'ppt-pdf':
                        showToast('تحويل PPTX ➔ PDF يحتاج معالجة سيرفر. يرجى التواصل معنا.');
                        break;
                }
            } catch (err) {
                console.error(err);
                showToast('خطأ: ' + (err.message || err));
            } finally {
                btn.disabled = false;
                btn.textContent = original;
            }
        }

        /* ========== 1) Word ➔ PDF ========== */
        async function convertWordToPdf(file) {
            const buffer = await file.arrayBuffer();
            const result = await mammoth.convertToHtml({ arrayBuffer: buffer });
            const html = result.value || '<p>(مستند فارغ)</p>';

            // إنشاء حاوية وهمية لتنسيق A4
            const container = document.createElement('div');
            Object.assign(container.style, {
                position: 'fixed', top: '0', left: '-10000px',
                width: '794px', padding: '40px',
                background: '#fff', color: '#000',
                fontFamily: 'Arial, sans-serif', fontSize: '14px', lineHeight: '1.7'
            });
            container.innerHTML = html;
            document.body.appendChild(container);

            try {
                await html2pdf().set({
                    margin: 10,
                    filename: file.name.replace(/\.docx$/i, '.pdf'),
                    image: { type: 'jpeg', quality: 0.95 },
                    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#fff' },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak: { mode: ['css', 'legacy'] }
                }).from(container).save();
                showToast('تم التحويل إلى PDF بنجاح ✓');
            } finally {
                document.body.removeChild(container);
            }
        }

        /* ========== 2) PDF ➔ Word ========== */
        async function convertPdfToWord(file) {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            const { Document, Packer, Paragraph, TextRun } = docx;

            const children = [];
            for (let p = 1; p <= pdf.numPages; p++) {
                const page = await pdf.getPage(p);
                const content = await page.getTextContent();

                // تجميع النص في أسطر حسب إحداثي Y
                const lines = {};
                content.items.forEach(it => {
                    if (!it.str) return;
                    const y = Math.round(it.transform[5]);
                    (lines[y] ||= []).push({ x: it.transform[4], str: it.str });
                });
                const ys = Object.keys(lines).map(Number).sort((a, b) => b - a);
                ys.forEach(y => {
                    const text = lines[y].sort((a, b) => a.x - b.x).map(i => i.str).join(' ');
                    if (text.trim()) children.push(new Paragraph({ children: [new TextRun(text)] }));
                });

                if (p < pdf.numPages)
                    children.push(new Paragraph({ children: [new TextRun('')], pageBreakBefore: true }));
            }

            const doc = new Document({
                sections: [{ children: children.length ? children : [new Paragraph('(لا يوجد نص)')] }]
            });
            const blob = await Packer.toBlob(doc);
            downloadBlob(blob, file.name.replace(/\.pdf$/i, '.docx'));
            showToast('تم التحويل إلى Word بنجاح ✓');
        }

        /* ========== 3) PDF ➔ PowerPoint ========== */
        async function convertPdfToPpt(file) {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            const pptx = new PptxGenJS();
            pptx.layout = 'LAYOUT_16x9';

            for (let p = 1; p <= pdf.numPages; p++) {
                const page = await pdf.getPage(p);
                const content = await page.getTextContent();

                const lines = {};
                content.items.forEach(it => {
                    if (!it.str) return;
                    const y = Math.round(it.transform[5]);
                    (lines[y] ||= []).push({ x: it.transform[4], str: it.str });
                });
                const text = Object.keys(lines).map(Number).sort((a, b) => b - a)
                    .map(y => lines[y].sort((a, b) => a.x - b.x).map(i => i.str).join(' '))
                    .join('\n');

                const slide = pptx.addSlide();
                slide.addText(`الصفحة ${p}`, { x: 0.3, y: 0.2, w: 9, h: 0.5, fontSize: 14, bold: true, color: '6366F1' });
                slide.addText(text || '(لا يوجد نص)', { x: 0.3, y: 0.8, w: 9.4, h: 4.5, fontSize: 12, valign: 'top', color: '333333' });
            }

            await pptx.writeFile({ fileName: file.name.replace(/\.pdf$/i, '.pptx') });
            showToast('تم التحويل إلى PowerPoint بنجاح ✓');
        }

        /* ------------------ اللغة (اختياري) ------------------ */
        function changeLanguage() { /* … */ }
    </script>
</body>
</html>
